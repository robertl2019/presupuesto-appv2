<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Presupuesto Personal</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap">
  <link rel="stylesheet" href="styles.css">

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- Chart.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@0.263.1/dist/umd/lucide.min.js"></script>
</head>
<body>

<!-- ═══════════════════════════ AUTH ═══════════════════════════ -->
<div id="auth-page">
  <div class="auth-card">
    <div class="auth-logo">💰 Presupuesto</div>
    <div class="auth-sub">Tus finanzas personales en orden</div>

    <div class="auth-tabs">
      <button class="auth-tab active" onclick="switchAuthTab('login')">Iniciar sesión</button>
      <button class="auth-tab"        onclick="switchAuthTab('register')">Registrarse</button>
    </div>

    <div class="form-group">
      <label>Correo electrónico</label>
      <input type="email" id="auth-email" placeholder="tu@correo.com" autocomplete="email">
    </div>
    <div class="form-group">
      <label>Contraseña</label>
      <input type="password" id="auth-pass" placeholder="••••••••" autocomplete="current-password">
    </div>
    <div class="form-group" id="auth-pass2-group" style="display:none">
      <label>Confirmar contraseña</label>
      <input type="password" id="auth-pass2" placeholder="••••••••" autocomplete="new-password">
    </div>

    <button class="btn-primary" id="auth-btn" onclick="doAuth()">Entrar</button>
    <div class="auth-err" id="auth-err"></div>
  </div>
</div>

<!-- ════════════════════════════ APP ═══════════════════════════ -->
<div id="app" style="display:none">

  <!-- SIDEBAR -->
  <div id="sidebar">
    <div class="sidebar-header">
      <span class="sidebar-brand">💰 Presupuesto</span>
      <button class="sidebar-toggle" onclick="toggleSidebar()" title="Contraer menú">
        <i data-lucide="menu" width="18" height="18"></i>
      </button>
    </div>

    <nav>
      <a class="nav-item active" data-page="dashboard" onclick="navigate('dashboard')">
        <span class="nav-icon"><i data-lucide="layout-dashboard"></i></span>
        <span class="nav-label">Dashboard</span>
      </a>
      <a class="nav-item" data-page="ingresos" onclick="navigate('ingresos')">
        <span class="nav-icon"><i data-lucide="trending-up"></i></span>
        <span class="nav-label">Ingresos</span>
      </a>
      <a class="nav-item" data-page="gastos" onclick="navigate('gastos')">
        <span class="nav-icon"><i data-lucide="credit-card"></i></span>
        <span class="nav-label">Gastos</span>
      </a>
      <a class="nav-item" data-page="mercado" onclick="navigate('mercado')">
        <span class="nav-icon"><i data-lucide="shopping-cart"></i></span>
        <span class="nav-label">Mercado</span>
      </a>
      <a class="nav-item" data-page="deudas" onclick="navigate('deudas')">
        <span class="nav-icon"><i data-lucide="alert-circle"></i></span>
        <span class="nav-label">Deudas</span>
      </a>
      <a class="nav-item" data-page="apps" onclick="navigate('apps')">
        <span class="nav-icon"><i data-lucide="smartphone"></i></span>
        <span class="nav-label">Apps</span>
      </a>
    </nav>

    <div class="sidebar-footer">
      <div class="user-row">
        <div class="user-avatar" id="user-avatar">R</div>
        <span class="user-email" id="user-email-label">usuario@email.com</span>
        <button class="logout-btn" onclick="doLogout()" title="Cerrar sesión">
          <i data-lucide="log-out" width="16" height="16"></i>
        </button>
      </div>
    </div>
  </div>

  <!-- MAIN -->
  <div id="main">
    <div id="page-content"></div>
  </div>
</div>

<!-- ══════════════════════════ MODAL ═══════════════════════════ -->
<div class="modal-overlay" id="modal-overlay" onclick="closeModal(event)">
  <div class="modal" id="modal">
    <div class="modal-header">
      <span class="modal-title" id="modal-title">Nuevo registro</span>
      <button class="modal-close" onclick="closeModal()">×</button>
    </div>
    <div class="modal-body" id="modal-body"></div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="closeModal()">Cancelar</button>
      <button class="btn btn-teal" id="modal-save" onclick="saveModal()">Guardar</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script src="app.js"></script>
</body>
</html>
